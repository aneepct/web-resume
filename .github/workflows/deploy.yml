name: Self-Hosted CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: web-resume-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, web-resume]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy with Docker Compose
        run: docker compose up --build -d
